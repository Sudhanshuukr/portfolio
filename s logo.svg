<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Stealth Container -->
    <linearGradient id="stealthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111c" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Hairline Border -->
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <!-- Platinum Monolith Gradient -->
    <linearGradient id="platinumMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#stealthBg)" stroke="url(#subtleBorder)" stroke-width="2" />

  <!-- Precision Minimalist Architectural S -->
  <path d="M 344 168 C 344 126 308 104 256 104 C 204 104 168 126 168 168 C 168 208 198 228 256 248 C 314 268 344 288 344 336 C 344 382 308 408 256 408 C 204 408 168 382 168 340" 
        fill="none" 
        stroke="url(#platinumMark)" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
